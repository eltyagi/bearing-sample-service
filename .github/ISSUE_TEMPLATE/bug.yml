name: Bug report
description: Report reproducible behavior in the sample service.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Include a focused reproduction and expected result.
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: What command or request demonstrates the problem?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation
      description: Which tests or checks should pass after the change?
    validations:
      required: true
